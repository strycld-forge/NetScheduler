# ================= NetScheduler 配置文件 =================
# 修改保存后自动生效，无需重启程序。
# 以 '#' 或 ';' 开头的行为注释。
# =========================================================

[Schedule]
# 断网生效的星期，0=周日 1=周一 ... 6=周六，逗号分隔
OffDays = 0,1,2,3,4
# 断网时刻（此时刻起禁用有线网卡）
OffTime = 22:00
# 恢复时刻（此时刻起重新启用有线网卡）
OnTime = 05:00

[Network]
# 有线网卡的连接名（控制面板 - 网络连接 里显示的名字，如：以太网）
# 留空 = 自动检测（检测到后会自动写回这里）
EthernetName = 以太网
# 手机热点的 Wi-Fi 配置文件名（一般就是热点名/SSID，需先手动连接保存过一次）
# 留空 = 自动检测（连着 Wi-Fi 时自动写回这里）。不填时断网后靠系统自动连接，
# 但主动秒连和掉线自动重连功能需要填上它（推荐连一次热点让它自动写入）。
WifiProfile =
# 断网时主动连接热点的重试次数与间隔（秒）；重试用尽后每分钟对账仍会继续尝试
ConnectRetries = 5
RetryIntervalSec = 30

[Whitelist]
# 白名单日期，这些日期不执行断网（全天保持有线开启）。逗号分隔，支持单日和区间：
#   单日: 2026-01-01
#   区间: 2026-01-20..2026-02-24
Whitelist =

[Behavior]
# true = 手动强制开/关 到下一个定时点后自动恢复为跟随计划（防止忘了改回来）
ManualExpiresNextEvent = true
# 断网时段内若 Wi-Fi 掉线，每分钟自动重连热点
KeepWifiConnected = true
# 状态对账间隔（秒），越小反应越快，资源占用也几乎不变
CheckIntervalSec = 60
# 日志文件大小上限（KB），超过后轮转为 .old
LogMaxSizeKB = 1024
